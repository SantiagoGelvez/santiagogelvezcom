# Las variantes de ADR-0011. `filtro` es el valor de `visible_en` que selecciona
# los registros de cada salida; `idiomas` es en cuáles se genera.
#
# **`idiomas` es una lista y no un escalar** (ADR-0026). SPEC §6 lo describía en
# singular, pero ADR-0011 exige cuatro PDFs de `cv-datos` —público y completo,
# en español y en inglés—, así que la variante no puede tener *un* idioma. El
# idioma es un eje ortogonal a la variante, y el pipeline deriva sus salidas de
# aquí en vez de llevarlas escritas en el script.

- id: cv-datos
  cargo_objetivo:
    es: Ingeniero de Datos
    en: Data Engineer
  idiomas: [es, en]
  filtro: cv-datos
  orden_secciones: [perfil, experiencia, proyectos, skills, certificaciones, educacion]

# Registrada pero sin generar (ADR-0011): `idiomas` vacío no es una opción —el
# esquema exige al menos uno—, así que lo que la deja fuera del pipeline es no
# estar en la lista de salidas que se construyen. Cuando se necesite, se generan
# sus PDFs sin tocar una línea de código.
- id: cv-itsm
  cargo_objetivo:
    es: Especialista ITSM
    en: ITSM Specialist
  idiomas: [es]
  filtro: cv-itsm
  orden_secciones: [perfil, experiencia, certificaciones, skills, educacion]
