# Sin niveles, sin porcentajes, sin barras de progreso (SPEC §6). El esquema no
# tiene dónde ponerlos, así que no se pueden agregar por descuido.
#
# `nombre` es bilingüe como el resto de la data (SPEC §6, "campos bilingües en
# línea"). En una herramienta las dos formas coinciden y se ve redundante; en
# una práctica no —"Modelado dimensional" / "Dimensional modeling"— y sin el
# campo el CV en inglés saldría con media lista en español.
#
# ⚠ La selección es provisional: refleja la trayectoria real (datos → fullstack
# → ITSM) pero Santiago decide qué se queda. Regla al podarla: aquí solo va lo
# que se pueda defender en una entrevista.

